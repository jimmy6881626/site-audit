<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}html{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>稽核拍照紀錄</title>

<style>
/* layout: sticky project bar + tabs on top, scrolling checklist, fixed totals bar at bottom */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --fg:#1c2427; --muted:#5b686d; --line:#d6dcda;
  --accent:#1f5f73; --accent-fg:#ffffff; --ok:#2b7a4b; --ok-bg:#e1f1e7;
  --bad:#b3261e; --bad-bg:#fbe3e0; --warn:#955400; --warn-bg:#fcecc9; --soft:#e8edec;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b; --surface:#1b2327; --fg:#e5ebed; --muted:#95a3a9; --line:#2e393e;
  --accent:#5db3ca; --accent-fg:#08181d; --ok:#6fcf97; --ok-bg:#16301f; --bad:#ff8f86; --bad-bg:#3b1b19;
  --warn:#ffc46b; --warn-bg:#392a0c; --soft:#243035; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#1b2327; --fg:#e5ebed; --muted:#95a3a9; --line:#2e393e;
  --accent:#5db3ca; --accent-fg:#08181d; --ok:#6fcf97; --ok-bg:#16301f; --bad:#ff8f86; --bad-bg:#3b1b19;
  --warn:#ffc46b; --warn-bg:#392a0c; --soft:#243035; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);margin:0;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.prow{display:flex;gap:8px;align-items:center}
.prow select{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg);font-weight:600}
.tabs{display:flex;gap:2px;margin-top:6px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding-top:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:17px;margin:0;text-wrap:balance} h3{font-size:14px;margin:0;color:var(--muted)}
p{margin:0} .muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 14px;height:42px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg);color:var(--fg);font-size:15px;resize:vertical;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select.in{
  height:42px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg);color:var(--fg);width:100%;min-width:0;font-size:15px}
.cnt{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .cnt input{width:72px;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;height:34px;padding:0 14px;cursor:pointer;font-size:13px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gh{width:100%;display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--soft);border:0;text-align:left;cursor:pointer;font-weight:700}
.gh .pg{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted);flex:none}
.gh .cv{flex:none;transition:transform .15s}.gh[aria-expanded=true] .cv{transform:rotate(90deg)}
.it{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px}
.no{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;display:flex;flex-direction:column;gap:2px}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:0 4px;width:max-content}
.tag.s{background:var(--bad-bg);color:var(--bad)} .tag.n{background:var(--warn-bg);color:var(--warn)}
.tx{background:none;border:0;text-align:left;padding:0;cursor:pointer;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.open .tx{display:block;-webkit-line-clamp:unset;overflow:visible}
.acts{display:flex;gap:6px}
.q{width:42px;height:42px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:19px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.q[aria-pressed=true].o{background:var(--ok);color:#fff;border-color:var(--ok)}
.q[aria-pressed=true].x{background:var(--bad);color:#fff;border-color:var(--bad)}
.q[aria-pressed=true].t{background:var(--warn);color:#fff;border-color:var(--warn)}
.q.cam{position:relative;color:var(--muted)} .q.cam b{position:absolute;top:-5px;right:-5px;background:var(--accent);color:var(--accent-fg);font-size:11px;border-radius:99px;min-width:18px;height:18px;line-height:18px;text-align:center}
.q input{display:none}
.ed{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px}
.cl{display:inline-flex;gap:6px;align-items:flex-start;padding:2px 0}
.cl input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.full{font-size:14px;line-height:1.9;white-space:pre-line}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;padding:0 2px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:96px;height:96px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar>div{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)} .sum b{color:var(--fg);font-size:16px}
.bb{display:flex;gap:8px} .bb .btn{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rec .m{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px}
.badge.d{background:var(--warn-bg);color:var(--warn)} .badge.k{background:var(--ok-bg);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:88vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="prow">
    <select id="projSel" aria-label="選擇工程"></select>

<script>
const DATA = {"groups": [{"sec": "H", "title": "墜落防止：有1.01~1.07之情事者，應立即改善。", "short": "墜落防止", "items": [{"key": "H1.01", "no": "1.01", "tag": "☆", "text": "於高差2公尺以上之工作場所邊緣及開口部分，□未設置符合規定之護欄、護蓋、安全網或□未配掛安全帶之防墜設施。"}, {"key": "H1.02", "no": "1.02", "tag": "☆", "text": "於高差2公尺以上之處所進行作業時，□未使用高空工作車，或□未以架設施工架等方法設置工作臺（工作臺應低於施工架立柱頂點1公尺以上）；設置工作臺有困難時，□未採取張掛安全網或配掛安全帶之設施。"}, {"key": "H1.03", "no": "1.03", "tag": "☆", "text": "於石綿板、鐵皮板、瓦、木板、茅草、塑膠等易踏穿材料構築之屋頂從事作業時，□未於屋架上設置防止踏穿及寬度30公分以上之踏板、□未裝設安全網或配掛安全帶。"}, {"key": "H1.04", "no": "1.04", "tag": "☆", "text": "於高差超過1.5公尺以上之場所作業，□未設置符合規定之安全上下設備。"}, {"key": "H1.05", "no": "1.05", "tag": "☆", "text": "高差超過2層樓或7.5公尺以上之鋼構建築，□未張設安全網，且其下方□未具有足夠淨空及工作面與安全網間具有障礙物。"}, {"key": "H1.06", "no": "1.06", "tag": "☆", "text": "使用移動式起重機吊掛平台從事貨物、機械等之吊升，鋼索於負荷狀態且非不得已情形下，使人員進入高度2公尺以上平台運搬貨物或駕駛車輛機械，平台□未採取設置圍欄、人員□未使用安全母索、安全帶等足以防止墜落之設施。"}, {"key": "H1.07", "no": "1.07", "tag": "※", "text": "於2公尺以上□未設護籠等保護裝置之垂直固定梯、局限空間、屋頂或施工架組拆、工作台組拆、管線維修作業等高處或傾斜面移動，□未採用全身背負式安全帶及捲揚式防墜器，□未使用補助繩移動之安全帶，應具備補助掛鉤，以供勞工作業移動中可交換鉤掛使用。"}, {"key": "H1.08", "no": "1.08", "tag": "※", "text": "護欄高度未符合安全規定(具有高度90公分以上之上欄杆、中欄杆及地盤面與樓板面間之上下開口距離，應不大於55公分、腳趾板)"}], "catno": "1"}, {"sec": "H", "title": "倒塌、崩塌防止：有2.01~2.10之情事者，應立即改善。", "short": "倒塌、崩塌防止", "items": [{"key": "H2.01", "no": "2.01", "tag": "☆", "text": "施工架之垂直方向5.5公尺、水平方向7.5公尺內，□未與穩定構造物妥實連接。"}, {"key": "H2.02", "no": "2.02", "tag": "☆", "text": "露天開挖場所開挖深度在1.5公尺以上，或有地面崩塌、土石飛落之虞時，□未設擋土支撐、反循環樁、連續壁、邊坡保護或□未設防護網之設施。"}, {"key": "H2.03", "no": "2.03", "tag": "☆", "text": "隧道、坑道作業有落磐或土石崩塌之虞，□未設置支撐、岩栓或噴凝土之支持構造及□未清除浮石；隧道、坑道進出口附近表土有崩塌或土石飛落，□未設置擋土支撐、張設防護網、清除浮石或邊坡保護之措施，進出口之地質惡劣時，□未採鋼筋混凝土從事洞口之防護。"}, {"key": "H2.04", "no": "2.04", "tag": "☆", "text": "模板支撐支柱基礎之周邊易積水，導致地盤軟弱，或軟弱地盤□未強化承載力。"}, {"key": "H2.05", "no": "2.05", "tag": "※", "text": "構造物及邊坡開挖□未有適當之防止坍塌措施。（坡度、擋土設施及水土保持）"}, {"key": "H2.06", "no": "2.06", "tag": "※", "text": "模板支撐之基礎承載力，未依土質狀況完成以下事項：□挖除表土及軟弱土層、□回填爐石渣或礫石、□整平並滾壓夯實、□鋪設足夠強度覆工板或RC 版等、□軟弱地盤區已強化其承載力。"}, {"key": "H2.07", "no": "2.07", "tag": "※", "text": "模板支撐圖說與現場施作，需專任工程人員簽認者，□未完成查核並留紀錄。"}, {"key": "H2.08", "no": "2.08", "tag": "※", "text": "模板支撐現場放樣，□未依照模板支撐圖說進行，並拍照存證。"}, {"key": "H2.09", "no": "2.09", "tag": "※", "text": "模板支撐底座及垂直支撐，□未依照現場放樣位置進行，並拍照存證。"}, {"key": "H2.10", "no": "2.10", "tag": "※", "text": "模板支撐水平方向及垂直方向之各構材的配置，□未依照模板支撐圖說完成。"}], "catno": "2"}, {"sec": "H", "title": "感電防止：有3.01~3.05之情事者，應立即改善。", "short": "感電防止", "items": [{"key": "H3.01", "no": "3.01", "tag": "☆", "text": "對電氣機具之帶電部分，於作業進行中或通行時，有因接觸 (含經由導電體而接觸者) 或接近致發生感電之虞者，□未設防止感電之護圍或絕緣被覆。"}, {"key": "H3.02", "no": "3.02", "tag": "☆", "text": "使用對地電壓在150伏特以上移動式或攜帶式電動機具，或於含水或被其他導電度高之液體濕潤之潮濕場所、金屬板上或鋼架上等導電性良好場所使用移動式或攜帶式電動機具，□未於各該電動機具之連接電路上設置適合其規格，具有高敏感度、高速型，能確實動作之防止感電用漏電斷路器。"}, {"key": "H3.03", "no": "3.03", "tag": "☆", "text": "於良導體機器設備內之狹小空間，或於鋼架等有觸及高導電性接地物之虞之場所，作業時所使用之交流電焊機 (不含自動式焊接者) ，□未裝設自動電擊防止裝置。"}, {"key": "H3.04", "no": "3.04", "tag": "☆", "text": "於架空電線或電氣機具電路之接近場所從事工作物之裝設、解體、檢查、修理、油漆等作業及其附屬性作業或使用車輛系營建機械、移動式起重機、高空工作車及其他有關作業時，該作業使用之機械、車輛或勞工於作業中或通行之際，有因接觸或接近該電路引起感電之虞者，□未使勞工與帶電體保持規定之接近界線距離，□未設置護圍或於該電路四周裝置絕緣用防護裝備或採取移開該電路之措施。"}, {"key": "H3.05", "no": "3.05", "tag": "☆", "text": "從事電路之檢查、修理等活線作業時，□未使該作業勞工戴用絕緣用防護具，或□未使用活線作業用器具或其他類似之器具，對高壓電路□未使用絕緣工作台及其他裝備，或□未避免使勞工之身體、其使用中之工具、材料等導電體接觸或接近有使勞工感電之虞之電路或帶電體。"}], "catno": "3"}, {"sec": "H", "title": "火災、爆炸：有4.01~4.06之情事者，應立即改善。", "short": "火災、爆炸", "items": [{"key": "H4.01", "no": "4.01", "tag": "☆", "text": "對於有危險物或有油類、可燃性粉塵等其他危險物存在之配管、儲槽、油桶等容器，從事熔接、熔斷或使用明火之作業或有發生火花之虞之作業，□未事先清除該等物質，並確認安全無虞。"}, {"key": "H4.02", "no": "4.02", "tag": "☆", "text": "對於存有易燃液體之蒸氣或有可燃性氣體滯留，而有火災、爆炸之作業場所，□未於作業前測定前述蒸氣、氣體之濃度；或其濃度爆炸下限值之30%以上時，未即刻使勞工退避至安全場所，並停止使用煙火及其他點火源之機具。"}, {"key": "H4.03", "no": "4.03", "tag": "☆", "text": "對於存有易燃液體之蒸氣、可燃性氣體或可燃性粉塵，致有引起火災、爆炸之工作場所，□未有通風、換氣、除塵、去除靜電等必要設施。"}, {"key": "H4.04", "no": "4.04", "tag": "☆", "text": "對於化學設備及其附屬設備之改善、修理、清掃、拆卸等作業，有危險物洩漏致危害作業勞工之虞，□未指定專人依規定將閥或旋塞設置雙重關閉或設置盲板。"}, {"key": "H4.05", "no": "4.05", "tag": "☆", "text": "對於設置熔融高熱物處理設備之建築物及處理、廢棄高熱礦渣之場所，□未設有良好排水設備及其他足以防止蒸氣爆炸之必要措施。"}, {"key": "H4.06", "no": "4.06", "tag": "☆", "text": "局限空間作業場所，□未禁止使用純氧換氣。"}], "catno": "4"}, {"sec": "H", "title": "中毒、缺氧：有5.01~5.05之情事者，應立即改善。", "short": "中毒、缺氧", "items": [{"key": "H5.01", "no": "5.01", "tag": "☆", "text": "在人孔、下水道、溝渠、污 (蓄) 水池、坑道、隧道、水井、集水 (液) 井、沈箱、儲槽、反應器、蒸餾塔、生 (消) 化槽、穀倉、船艙、逆打工法之地下層、筏基坑、溫泉業之硫磺儲水桶及其他自然換氣不充分之工作場所有下列情形之一時：\n(一) 空氣中氧氣濃度未滿19%、硫化氫濃度超過10 PPM 或一氧化碳濃度超過35 PPM時，□未確實配戴空氣 呼吸器等呼吸防護具、安全帶及安全索。\n(二)□未確實配戴空氣呼吸器等呼吸防護具時，未置備通風設備予以適當換氣，或未置備空氣中氧氣、硫化氫、一氧化碳濃度之測定儀器，並未隨時測定保持氧氣濃度在百分之19以上、硫化氫濃度在10 PPM以下及一氧化碳濃度在35 PPM以下。"}, {"key": "H5.02", "no": "5.02", "tag": "☆", "text": "於曾裝儲有機溶劑或其混合物之儲槽內部、通風不充分之室內作業場所，或在未設有密閉設備、局部排氣裝置或整體換氣裝置之儲槽等之作業場所，□未供給作業勞工輸氣管面罩，並使其確實佩戴使用。"}, {"key": "H5.03", "no": "5.03", "tag": "☆", "text": "製造、處置或使用特定化學物質危害預防標準所稱之丙類第一種或丁類物質之特定化學管理設備時，□未設置適當之溫度、壓力及流量之計測裝置及發生異常之自動警報裝置。"}, {"key": "H5.04", "no": "5.04", "tag": "☆", "text": "製造、處置或使用特定化學物質危害預防標準所稱之丙類第一種及丁類物質之特定化學管理設備，□未設遮斷原料、材料、物料之供輸、□未設卸放製品之裝置、□未設冷卻用水之裝置，或□未供輸惰性氣體。"}, {"key": "H5.05", "no": "5.05", "tag": "☆", "text": "處置或使用特定化學物質危害預防標準所稱之丙類第一種或丁類物質時，□未設洩漏時能立即警報之器具及除卻危害必要藥劑容器之設施。"}], "catno": "5"}, {"sec": "H", "title": "交通維持：有6.01之情事者，應立即改善。", "short": "交通維持", "items": [{"key": "H6.01", "no": "6.01", "tag": "※", "text": "於道路或鄰接道路從事作業，未採取安衛措施，致有立即發生交通事故之虞。"}], "catno": "6"}, {"sec": "G", "title": "墜落防止:(1.01-1.08皆為高風險稽核項目)", "short": "墜落防止", "items": [], "catno": "1"}, {"sec": "G", "title": "倒塌、崩塌防止：(2.01-2.10為高風險稽核項目;2.11-2.13為一般風險稽核項目)", "short": "倒塌、崩塌防止", "items": [{"key": "G2.11", "no": "2.11", "tag": "", "text": "□未事前確認地下管線位置及範圍(電力線，電信線、自來水、污水、瓦斯管)。"}, {"key": "G2.12", "no": "2.12", "tag": "", "text": "施工架及施工構台基礎地面□未平整且夯實緊密，□未禁止不得與混凝土模板支撐或其他臨時構造連結，□未以斜撐材作適當之支撐。"}, {"key": "G2.13", "no": "2.13", "tag": "", "text": "供作模板支撐之材料，□明顯之損壞、變形或腐蝕。"}], "catno": "2"}, {"sec": "G", "title": "感電防止：(3.01-3.05為高風險稽核項目;3.06-3.10為一般風險稽核項目)", "short": "感電防止", "items": [{"key": "G3.06", "no": "3.06", "tag": "", "text": "接近各類架空纜線應保持安全距離，□未由專人監督指揮，危險管制區□未明確標示，並設警告標誌。"}, {"key": "G3.07", "no": "3.07", "tag": "", "text": "臨時用電設備裝設漏電斷路器及接地線(應設置銅棒，不得以鋼筋替代)，移動電線□未予以架高等措施。"}, {"key": "G3.08", "no": "3.08", "tag": "", "text": "臨時配電箱應上鎖管理，□未標示維護管理人員之姓名、行動電話及巡檢紀錄；臨時配電箱內□未於各分電路上設置適合且能確實動作之防止感電用漏電斷路器。"}, {"key": "G3.09", "no": "3.09", "tag": "", "text": "橫越通路之延長電線架高/保護，□未有破損或裸接現象。"}, {"key": "G3.10", "no": "3.10", "tag": "", "text": "電焊機外殼□未有接地或自動電擊防止裝置，線路裸露處□未有絕緣包覆、正確裝設機具（輸出線路多條等）、自動電擊防止裝置作動應正常；電焊機□未使用專用線，焊線及焊柄絶緣是否良好。"}], "catno": "3"}, {"sec": "G", "title": "火災爆炸:4.01-4.06皆為高風險稽核項目;中毒、缺氧:5.01-5.05皆為高風險稽核項目", "short": "火災爆炸", "items": [], "catno": "4~5"}, {"sec": "G", "title": "交通維持:6.01為高風險稽核項目;6.02-6.12為一般風險稽核項目", "short": "交通維持", "items": [{"key": "G6.02", "no": "6.02", "tag": "※", "text": "承包商□擅自封閉或佔用大眾通行道路逕行施工者"}, {"key": "G6.03", "no": "6.03", "tag": "", "text": "交通維持計畫：□未依規定報准 □未依核准計畫執行"}, {"key": "G6.04", "no": "6.04", "tag": "", "text": "工程告示牌：□未設置工地□尺寸或內容不符規定 □破壞未修或未重豎"}, {"key": "G6.05", "no": "6.05", "tag": "※", "text": "施工時工地前後路段或岔路之下列警告設施欠缺或設置不符規定：□施工、限速、禁止超車或其他標誌 □拒馬、交通錐 □改道標"}, {"key": "G6.06", "no": "6.06", "tag": "※", "text": "交通警告或阻隔設施：□不清晰 □排列不齊順 □未配合實際情況需要調整□夜間無反光或警告燈號"}, {"key": "G6.07", "no": "6.07", "tag": "※", "text": "提供大眾通行之道路□路面有坑洞且無警告設施□車輛機械或施工料具未設安全警示設施□積水□髒污"}, {"key": "G6.08", "no": "6.08", "tag": "※", "text": "臨時改道路線並無足夠警告設施：□突然變窄 □急彎 □阻礙交通"}, {"key": "G6.09", "no": "6.09", "tag": "※", "text": "□施工道路兩旁住戶進出通道未維護"}, {"key": "G6.10", "no": "6.10", "tag": "※", "text": "市區或交通密集路段未依規定：□分段施工 □分側施工"}, {"key": "G6.11", "no": "6.11", "tag": "※", "text": "臨時或緊急情況需要阻礙交通時未設：□警告標示 □必要之交通指揮及未知會本局工地工程司"}, {"key": "G6.12", "no": "6.12", "tag": "※", "text": "車輛機械□未裝設倒車或旋轉警示燈□未裝設蜂鳴器□倒車或旋轉警示燈、蜂鳴器未能作用□未設置作業半徑警示設施□移動式起重機、總重量逾3.5公噸之客、貨車未設置行車視野輔助系統□車輛未依規定裝設行車紀錄器□大客車、移動式起重機未依規定設置轉彎及倒車警報裝置□大客車、大貨車、曳引車、小型車附掛之廂式拖車未備有合於規定之滅火器。"}, {"key": "G6.13", "no": "6.13", "tag": "※", "text": "在提供通行道路從事路面加封或修補、道路清掃、刈草、綠化或使勞工在路面上從事其他類似之機動性作業，無□交通指揮人員□設備□未持指揮棒（指揮旗）"}, {"key": "G6.14", "no": "6.14", "tag": "※", "text": "承包商因施工需佔用或阻斷大眾通行道路，而□未依規定於施工路段或相關之各岔路口前後設置適當之交通管制及防護設施，以維交通安全者"}, {"key": "G6.15", "no": "6.15", "tag": "※", "text": "承包商依第01556章交通維持3.3.2及「快速公路施工交通管制手冊」規定□未辦理每日施工前現場交通管制設施檢查"}], "catno": "6"}, {"sec": "G", "title": "被撞防止：", "short": "被撞防止", "items": [{"key": "G7.01", "no": "7.01", "tag": "", "text": "於搬運機械作業或開挖作業時，□未指派專人指揮，防止機械翻覆或勞工自機械後側接近作業場所、□未嚴禁操作人員以外之勞工進入營建用機械之操作半徑範圍內。"}, {"key": "G7.02", "no": "7.02", "tag": "", "text": "工作場所出入口□未設置方便人員及車輛出入之拉開式大門，作業上無出入必要時應關閉，並標示禁止無關人員擅入工作場所。車輛機械出入頻繁之場所，必須打開工地大門等時，□未置交通引導人員，引導車輛機械出入。"}], "catno": "7"}, {"sec": "G", "title": "物體飛落防止：", "short": "物體飛落防止", "items": [{"key": "G8.01", "no": "8.01", "tag": "", "text": "起重機具運轉時，□未採取防止吊掛物通過人員上方及人員進入吊掛物下方之設備或措施。"}, {"key": "G8.02", "no": "8.02", "tag": "", "text": "工作台□未設置護網及腳趾版(高10cm)"}, {"key": "G8.03", "no": "8.03", "tag": "", "text": "場撐作業下方□未設置双層安全網(10×10cm及2×2cm)，臨路側□未設置塑膠布阻隔。"}, {"key": "G8.04", "no": "8.04", "tag": "", "text": "施工場所對於置放於高處之物件有飛落之虞者，□未予以固定之。"}, {"key": "G8.05", "no": "8.05", "tag": "", "text": "施工場所□未禁止勞工以投擲之方式運送任何物料。"}], "catno": "8"}, {"sec": "G", "title": "一般性規定", "short": "一般性規定", "items": [{"key": "G9.01", "no": "9.01", "tag": "", "text": "進入工區□未佩戴安全帽、□未穿反光背心。"}, {"key": "G9.02", "no": "9.02", "tag": "", "text": "銲接作業□未使用適當防護（□護目鏡、□手套）。"}, {"key": "G9.03", "no": "9.03", "tag": "", "text": "高架作業□未配帶安全帶(需使用補助繩移動之安全帶應具備補助掛鉤)。"}], "catno": "9"}, {"sec": "G", "title": "工作場所災害防止：", "short": "工作場所災害防止", "items": [{"key": "G10.01", "no": "10.01", "tag": "", "text": "工區內□未嚴禁飲用酒精性飲料。"}, {"key": "G10.02", "no": "10.02", "tag": "", "text": "□未物料分類堆置整齊影響人員動線、阻礙交通或出入口。"}, {"key": "G10.03", "no": "10.03", "tag": "", "text": "氧氣乙炔鋼瓶□未依規定儲存、搬運、使用□未加設遮陽設施□未禁止煙火之警告標誌並配置滅火器材"}, {"key": "G10.04", "no": "10.04", "tag": "", "text": "高度7公尺以上且立面面積達330平方公尺之以上施工架、施工構台、開挖深度1.5公尺以上之擋土支撐及模板支撐等假設工程之組立與拆除，□未由專任工程人員妥為設計(計算書經核可)並□未繪製施工詳圖。"}, {"key": "G10.05", "no": "10.05", "tag": "", "text": "露天開挖、擋土支撐、施工架及施工構台組配、模板支撐、鋼構組配等之營造作業，□未指派各作業主管人員於作業現場監督指揮。"}, {"key": "G10.06", "no": "10.06", "tag": "", "text": "工作場所暴露之鋼筋、鋼材、鐵件、鋁件及其他材料等易生職業災害者，□未採取彎曲尖端、□未加蓋或□未加裝護套等防護設施。"}, {"key": "G10.07", "no": "10.07", "tag": "", "text": "支撐架作業時，□未設置防止人員進入推進路線下方之設施。"}], "catno": "10"}, {"sec": "G", "title": "營建機械：", "short": "營建機械", "items": [{"key": "G11.01", "no": "11.01", "tag": "", "text": "營建機械□未實施定期檢查及作業前檢點。"}, {"key": "G11.02", "no": "11.02", "tag": "", "text": "除乘坐席外，作業時不得搭載勞工；作業半徑內□未禁止人員進入。"}, {"key": "G11.03", "no": "11.03", "tag": "", "text": "□未禁止營建機械停放於有滑落之虞之斜坡或未設置輪檔或□夜間停放於交通要道。"}, {"key": "G11.04", "no": "11.04", "tag": "", "text": "堆高機與起重機操作人員及吊掛作業人員□未接受安全衛生操作人員及吊掛作業人員訓練或技能檢定合格。"}, {"key": "G11.05", "no": "11.05", "tag": "", "text": "固定式起重機、移動式起重機□未經檢查合格。"}, {"key": "G11.06", "no": "11.06", "tag": "", "text": "起重機其外伸撐座伸至最大極限位置，外伸時□未檢查墊腳基礎應穩固。"}, {"key": "G11.07", "no": "11.07", "tag": "", "text": "移動式起重機捲揚制動設備(刹車)、吊桿過舉預防□未正常。"}, {"key": "G11.08", "no": "11.08", "tag": "", "text": "起重機具□未有過捲預防裝置。"}, {"key": "G11.09", "no": "11.09", "tag": "", "text": "起重機具之吊鉤、吊具□未有防止吊物脫落裝置。"}, {"key": "G11.10", "no": "11.10", "tag": "", "text": "機身□未裝置警示燈及警報裝置；□機身明顯處應未標示額定荷重。"}, {"key": "G11.11", "no": "11.11", "tag": "", "text": "吊索□有損壞或變形之情形。"}, {"key": "G11.12", "no": "11.12", "tag": "", "text": "起重機械負有荷重時□操作手擅離操作位置；或停機時□未將該荷重置於地面。"}], "catno": "11"}, {"sec": "G", "title": "上下設備：", "short": "上下設備", "items": [{"key": "G12.01", "no": "12.01", "tag": "", "text": "底部□未於平整地面，必要時□未設置墊材，以確保其穩定性。"}, {"key": "G12.02", "no": "12.02", "tag": "", "text": "□未置備高度75cm以上之堅固扶手。"}, {"key": "G12.03", "no": "12.03", "tag": "", "text": "高度8M以上之階梯□未每隔7M內設置平台一處，平台如用漏空格條製成，其縫間隙□超過30公厘；超過時□未裝置鐵絲網防護。"}, {"key": "G12.04", "no": "12.04", "tag": "", "text": "設置固定梯子踏條與牆壁間□未保持16.5cm以上之淨距，梯頂□未突出板面60cm以上。"}, {"key": "G12.05", "no": "12.05", "tag": "", "text": "固定梯子梯長連續超過6M時，□未每隔9M以下設一平台，並應於距梯底2M以上部分，□未設置護籠或其他保護裝置。(未設置護籠或其他保護裝置，已於每隔6M以下設一平台者，不在此限。)"}], "catno": "12"}, {"sec": "G", "title": "環境保護", "short": "環境保護", "items": [{"key": "環1", "no": "1", "tag": "", "text": "土、砂、石料：□未集中妥善維護致流入水溝 □泥濘 □飛散□未覆蓋防塵布或防塵網"}, {"key": "環2", "no": "2", "tag": "※", "text": "工區： □垃圾未清理 □不乾淨 □未設置必要之垃圾箱 □廢棄物就地燃燒行為"}, {"key": "環3", "no": "3", "tag": "※", "text": "因施工造成: □垃圾 □污水 □污泥 □油液 □其他廢棄物污染或流出工區外"}, {"key": "環4", "no": "4", "tag": "※", "text": "提供通行路面：□積水 □泥濘 □塵土飛楊"}, {"key": "環5", "no": "5", "tag": "", "text": "污水沈澱設備：□未設置 □未有效使用 □未設護欄設施"}, {"key": "環6", "no": "6", "tag": "", "text": "工地出入口：□未設置洗車台或沖洗設備 □未設置污水沈澱設備□有設置洗車設備惟未有效使用"}, {"key": "環7", "no": "7", "tag": "", "text": "□有明顯噪音 □污水傷害並無有效防制設施，且未依本局要求提供合格檢測數據"}, {"key": "環8", "no": "8", "tag": "※", "text": "□未確保環境品質 □造成公害糾紛"}, {"key": "環9", "no": "9", "tag": "", "text": "工地周界設置圍籬或護欄□損壞未修□未緊密連接V□警示燈未設置，每20組請加註局徽等圖案□防溢座損壞未修"}, {"key": "環10", "no": "10", "tag": "", "text": "裸露地表□無覆蓋防塵布或防塵網□防塵布或防塵網破損或毀壞"}, {"key": "環11", "no": "11", "tag": "", "text": "運送物料之車輛機具□未覆蓋□有覆蓋但未延伸至車斗以下15公分□未捆紮牢固"}, {"key": "環12", "no": "12", "tag": "", "text": "營建工地逕流廢水污染削減計畫書□未辦理 □未依規定報准□未依計畫執行"}]}, {"sec": "G", "title": "其他不符規定及改進事項", "short": "其他不符規定", "items": [{"key": "其1", "no": "1", "tag": "※", "text": "各分項作業施工危害因素告知單□無 □欠缺□內容不符實際"}, {"key": "其2", "no": "2", "tag": "", "text": "工作場所巡視、協議及處理紀錄表□無 □欠缺□內容不符實際"}, {"key": "其3", "no": "3", "tag": "", "text": "本工程今日施工勞工人數    人,是否皆為合法勞工且均已投保勞工保險□是□否"}, {"key": "其4", "no": "4", "tag": "", "text": "安全衛生工作守則□未訂定□未會同勞工代表訂定□未報經檢查機構備查□未公告實施□未置工地備查"}, {"key": "其5", "no": "5", "tag": "", "text": "職業安全衛生人員：□未僱用 □未常駐工地□因故未能執行職務無代理人□未按規定報備□更換未按規定報備"}, {"key": "其6", "no": "6", "tag": "", "text": "每日期限前實施「交通部施工安全動態即時管理系統」通報□未通報□內容不符規定"}, {"key": "其7", "no": "7", "tag": "", "text": "急救設備或措施欠缺：□藥品 □器材□救生設備□緊急應變組織看板"}]}], "notes": [["一、", "本稽(複)核表依據本局『施工說明書技術規定』相關章節訂定之。"], ["二、", "本稽(複)核表應以每標工程為單位分別填寫，如需扣款時，本稽(複)核表並作為當期工程估驗扣款憑證。"], ["三、", "本局所屬各單位之稽核人員，對承包商實施工地稽核時，應依本表所列稽核項目及相關法令，配合工程實際施工項目詳實查核。"], ["四、", "凡有缺失項目者，請在「稽核項目」欄□內明白勾劃（ˇ）或填列數據，如有其他缺失而表內未列有稽核項目時，請依實填寫於「其他不符規定及改進事項」空白欄內；以上稽核必要時請填寫其缺失地點。"], ["五、", "稽(複)核結果以下列方式表示：「○」代表符合規定。「 × 」代表應依規定扣款及改善，「△」代表應請改善，（扣款部份請參閱本局「施工說明書技術規定」相關章節之罰則規定）。空白者代表稽核當時無須辦理或未稽核此項工作。"], ["六、", "稽(複)核結果缺失事項經知會後，承包商應即配合實際需要依規定改善並將改善情形拍照送交本局工地工程司存查，項次打「☆」者為勞動檢查法第28條有立即危險之虞，須停工改善，項次打「※」者應即日改善，其餘改善時間除特准外最久不得超過五日。"], ["七、", "缺失事項於改善期限內，承包商仍應負責採取防止災害發生之必要措施。"], ["八、", "缺失項次6.02、6.13及6.14罰款依照施工說明書第01556章3.10罰則 罰款6000元。、缺失項次6.15罰款(1)快速公路施工，每次罰款新臺幣二萬元。(2)一般省道施工，每次罰款新臺幣六千元。"], ["九、", "施工說明書第01574章3.26.2.4 其他不符規定項目經通知承包商限期改善，仍未辦理者，按工程契約金額之不同分別罰款如下︰ （1）契約金額未滿1千萬元者，每項次罰款3,000元。 （2）契約金額1千萬元以上者，每項次罰款5,000元。"]]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const fmt = n => Number(n || 0).toLocaleString('en-US');
const nowDT = () => { const d = new Date(); return {date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}; };
const roc = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? {y:+m[1]-1911, m:+m[2], d:+m[3]} : {y:'', m:'', d:''}; };
const rocStr = iso => { const r = roc(iso); return r.y === '' ? '' : `${r.y}年${r.m}月${r.d}日`; };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- items ---------- */
const ALL = [];
DATA.groups.forEach((g, gi) => { g.gid = 'g' + gi; g.items.forEach(item => ALL.push({item, g})); });
const ITEM = {}; ALL.forEach(x => ITEM[x.item.key] = x);
const isEnv = g => g.short === '環境保護' || g.short === '其他不符規定';
const labelOf = (item, g) => {
  if (g.short === '環境保護') return '環境保護.' + item.no;
  if (g.short === '其他不符規定') return '其他不符規定.' + item.no;
  return g.short + '.' + item.no;
};

/* ---------- storage (IndexedDB, fallback memory) ---------- */
let db = null, dbOK = true;
const openDB = () => new Promise(res => {
  try {
    const r = indexedDB.open('sinton-audit', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('projects', {keyPath:'id'}); r.result.createObjectStore('audits', {keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
  } catch (e) { res(null); }
});
const idbAll = st => new Promise(res => { if (!db) return res([]); try { const q = db.transaction(st).objectStore(st).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => res([]); } catch (e) { res([]); } });
const idbPut = (st, o) => { if (!db) return; try { db.transaction(st, 'readwrite').objectStore(st).put(o); } catch (e) {} };
const idbDel = (st, id) => { if (!db) return; try { db.transaction(st, 'readwrite').objectStore(st).delete(id); } catch (e) {} };
const timers = {};
const saveLater = (st, o) => { clearTimeout(timers[o.id]); timers[o.id] = setTimeout(() => idbPut(st, o), 300); };

/* ---------- state ---------- */
const S = {projects:[], audits:[], pid:null, aid:null, tab:'audit', filter:'H', q:'', open:null, collapsed:{}};
const P = () => S.projects.find(p => p.id === S.pid);
const A = () => S.audits.find(a => a.id === S.aid);
const pAud = pid => S.audits.filter(a => a.pid === pid).sort((a, b) => a.seq - b.seq);
const ist = (a, k) => a.items[k] || {res:'', ck:[], place:'', note:'', amt:null, photos:[], prev:'', text:''};
const ens = (a, k) => a.items[k] || (a.items[k] = {res:'', ck:[], place:'', note:'', amt:null, photos:[], prev:'', text:''});
const OTHER_G = DATA.groups.find(g => g.short === '其他不符規定');
const extraItems = a => (a.xs || []).map((k, i) => ({item:{key:k, no:String(OTHER_G.items.length + 1 + i), tag:'', text:(a.items[k] && a.items[k].text) || '（未填寫缺失內容）', custom:true}, g:OTHER_G}));
const itemsOf = a => ALL.concat(extraItems(a));

function defAmt(item, p) {
  const k = item.key;
  if (k === 'G6.02' || k === 'G6.13' || k === 'G6.14') return 6000;
  if (k === 'G6.15') return p && p.road === 'fast' ? 20000 : 6000;
  return (p && Number(p.contract) >= 10000000) ? 5000 : 3000;
}
const amtOf = (s, item, p) => (s.amt !== null && s.amt !== '' && s.amt !== undefined) ? Number(s.amt) : defAmt(item, p);
function counts(a, p) {
  let defects = 0, total = 0;
  for (const {item} of itemsOf(a)) {
    const s = a.items[item.key]; if (!s) continue;
    if (s.res === 'x' || s.res === 't') defects++;
    if (s.res === 'x') total += amtOf(s, item, p);
  }
  return {defects, total};
}
function compute(a) {
  const p = S.projects.find(x => x.id === a.pid) || {};
  const prior = pAud(a.pid).filter(x => x.seq < a.seq);
  const rows = {};
  for (const {item} of ALL) {
    const s = a.items[item.key];
    let pc = 0, pd = '';
    for (const x of prior) {
      const t = x.items[item.key]; if (!t) continue;
      if (t.res === 'x') pc += amtOf(t, item, p);
      if (t.res === 'x' || t.res === 't') pd = x.date;
    }
    const cur = s && s.res === 'x' ? amtOf(s, item, p) : 0;
    rows[item.key] = {cur, cum:pc + cur, prevDate:(s && s.prev) || pd};
  }
  for (const {item} of extraItems(a)) { const s = a.items[item.key], cur = s && s.res === 'x' ? amtOf(s, item, p) : 0; rows[item.key] = {cur, cum:cur, prevDate:(s && s.prev) || ''}; }
  const me = counts(a, p);
  let cd = Number(p.baseDefects) || 0, ct = Number(p.baseTotal) || 0;
  prior.forEach(x => { const c = counts(x, p); cd += c.defects; ct += c.total; });
  return {rows, defects:me.defects, total:me.total, cumDefects:cd + me.defects, cumTotal:ct + me.total,
    n:(a.nOver ?? (prior.length + 1)), cumN:(a.cumOver ?? ((Number(p.baseCount) || 0) + prior.length + 1))};
}

/* ---------- photos ---------- */
const shrink = (file, max = 1400, q = .78) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = () => rej();
  r.onload = () => {
    const raw = r.result, im = new Image();
    im.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h); res(c.toDataURL('image/jpeg', q));
      } catch (e) { res(raw); }
    };
    im.onerror = () => rej();
    im.src = raw;
  };
  r.readAsDataURL(file);
});

function clauses(it, s) {
  const parts = it.text.split('□');
  let out = esc(parts[0]);
  for (let i = 1; i < parts.length; i++) {
    const on = s.ck.includes(i - 1);
    out += `<label class="cl"><input type="checkbox" data-ck="${i-1}" data-k="${it.key}"${on ? ' checked' : ''}><span>${esc(parts[i])}</span></label>`;
  }
  return out;
}
function autoNote(it, s) {
  const parts = it.text.split('□').slice(1);
  const pick = s.ck.filter(i => parts[i] !== undefined).map(i => parts[i].replace(/[。；;，,、\s]+$/,'').replace(/^[、，,\s]+/,''));
  if (pick.length) return pick.join('、');
  const t = it.text.replace(/□/g, '').replace(/\s+/g, '');
  return t.length > 60 ? t.slice(0, 60) + '…' : t;
}
